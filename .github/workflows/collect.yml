name: Collect Cheongju heat log

on:
  schedule:
    - cron: '7,37 * * * *'    # 정각은 GitHub 스케줄러가 혼잡해 지연이 큼 → 분산 + 시간당 2회 시도
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heat-log
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather & backfill log
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: |
          cat > collect.mjs <<'EOF'
          import { readFileSync, writeFileSync, existsSync, mkdirSync } from 'node:fs';

          const LAT = 36.6424, LON = 127.4890;
          const NX = 69, NY = 106;          // 기상청 격자 (청주)
          const START_H = 9, END_H = 19;    // 기록 대상 정시 (근무 08:30~19:00)
          const KMA_KEY = process.env.KMA_KEY || '';

          const wb = (Ta, RH) => Ta*Math.atan(0.151977*Math.pow(RH+8.313659,0.5)) + Math.atan(Ta+RH)
            - Math.atan(RH-1.676331) + 0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH) - 4.686035;
          const perceived = (Ta, RH) => {
            const Tw = wb(Ta, RH);
            return Math.round((-0.2442 + 0.55399*Tw + 0.45535*Ta - 0.0022*Tw*Tw + 0.00278*Tw*Ta + 3.0)*10)/10;
          };

          // 기상청 초단기실황 = 해당 시각의 관측값. 키 없거나 실패하면 null.
          async function kma(ymd, hh) {
            if (!KMA_KEY) return null;
            const u = 'https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst'
              + `?serviceKey=${KMA_KEY}&dataType=JSON&numOfRows=100&pageNo=1`
              + `&base_date=${ymd}&base_time=${hh}00&nx=${NX}&ny=${NY}`;
            try {
              const j = await (await fetch(u)).json();
              const items = j?.response?.body?.items?.item;
              if (!Array.isArray(items)) return null;
              const pick = c => { const v = items.find(x => x.category === c); return v ? Number(v.obsrValue) : null; };
              const ta = pick('T1H'), rh = pick('REH');
              return (ta != null && rh != null && !Number.isNaN(ta) && !Number.isNaN(rh)) ? { ta, rh } : null;
            } catch { return null; }
          }

          // 폴백: Open-Meteo 시간별 (기상청 키가 없거나 조회 실패한 시간대만)
          const om = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
            + '&hourly=temperature_2m,relative_humidity_2m&past_days=2&forecast_days=1&timezone=Asia%2FSeoul'
          ).then(r => r.json()).catch(() => null);
          const omAt = (dash, hh) => {
            if (!om?.hourly?.time) return null;
            const i = om.hourly.time.indexOf(`${dash}T${hh}:00`);
            if (i < 0) return null;
            const ta = om.hourly.temperature_2m[i], rh = om.hourly.relative_humidity_2m[i];
            return (ta == null || rh == null) ? null : { ta, rh };
          };

          if (!existsSync('data')) mkdirSync('data');
          let logs = [];
          try { logs = JSON.parse(readFileSync('data/log.json','utf8')); } catch {}
          const have = new Set(logs.map(r => r.t.slice(0,13)));   // 'YYYY-MM-DD HH'

          const nowKst = new Date(Date.now() + 9*3600*1000);      // 러너는 UTC
          const p = n => String(n).padStart(2,'0');

          // 최근 3일 × 근무시간 정시 중 비어 있는 시간대를 모두 채움 (스케줄이 밀려도 빈칸이 남지 않음)
          const targets = [];
          for (let d = 2; d >= 0; d--) {
            const day = new Date(nowKst.getTime() - d*86400*1000);
            const ymd = `${day.getUTCFullYear()}${p(day.getUTCMonth()+1)}${p(day.getUTCDate())}`;
            const dash = `${day.getUTCFullYear()}-${p(day.getUTCMonth()+1)}-${p(day.getUTCDate())}`;
            for (let h = START_H; h <= END_H; h++) {
              if (have.has(`${dash} ${p(h)}`)) continue;
              if (d === 0 && h > nowKst.getUTCHours()) continue;   // 미래 시각 제외
              targets.push({ ymd, dash, h });
            }
          }

          let added = 0, byKma = 0;
          for (const t of targets) {
            let v = await kma(t.ymd, p(t.h));
            let src = '기상청 초단기실황(청주)';
            if (v) byKma++; else { v = omAt(t.dash, p(t.h)); src = 'Open-Meteo(청주)'; }
            if (!v) continue;
            const isoMs = Date.UTC(+t.dash.slice(0,4), +t.dash.slice(5,7)-1, +t.dash.slice(8,10), t.h) - 9*3600*1000;
            logs.push({
              iso: new Date(isoMs).toISOString(),
              t: `${t.dash} ${p(t.h)}:00`,
              ta: v.ta, rh: v.rh, pt: perceived(v.ta, v.rh), src
            });
            have.add(`${t.dash} ${p(t.h)}`);
            added++;
          }

          if (!added) { console.log('추가할 시간대 없음'); process.exit(0); }

          logs.sort((a,b) => a.t.localeCompare(b.t));
          if (logs.length > 20000) logs = logs.slice(-20000);
          writeFileSync('data/log.json', JSON.stringify(logs));
          console.log(`${added}건 기록 (기상청 ${byKma} / 폴백 ${added-byKma}), 총 ${logs.length}건`);
          EOF
          node collect.mjs

      - name: Commit
        run: |
          git config user.name "heat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/log.json
          git diff --staged --quiet || git commit -m "log: $(date -u +%FT%TZ)"
          git push
