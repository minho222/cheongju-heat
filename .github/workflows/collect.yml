name: Collect Cheongju heat log

on:
  schedule:
    - cron: '0 * * * *'      # 매시간(UTC) 실행 → 스크립트가 KST 근무시간만 기록
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: heat-log
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather & append log
        run: |
          cat > collect.mjs <<'EOF'
          import { readFileSync, writeFileSync, existsSync, mkdirSync } from 'node:fs';
          const LAT = 36.6424, LON = 127.4890;
          const nowUTC = new Date();
          const kst = new Date(nowUTC.getTime() + 9*3600*1000);   // KST = UTC+9
          const mins = kst.getUTCHours()*60 + kst.getUTCMinutes();
          if (mins < 510 || mins > 1140) { console.log('근무시간(08:30~19:00 KST) 외 — 건너뜀'); process.exit(0); }
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul`;
          const j = await fetch(url).then(r => r.json());
          const Ta = j.current.temperature_2m, RH = j.current.relative_humidity_2m;
          const wb = (Ta,RH) => Ta*Math.atan(0.151977*Math.pow(RH+8.313659,0.5)) + Math.atan(Ta+RH) - Math.atan(RH-1.676331) + 0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH) - 4.686035;
          const Tw = wb(Ta,RH);
          const pt = Math.round((-0.2442 + 0.55399*Tw + 0.45535*Ta - 0.0022*Tw*Tw + 0.00278*Tw*Ta + 3.0)*10)/10;
          const p = n => String(n).padStart(2,'0');
          const t = `${kst.getUTCFullYear()}-${p(kst.getUTCMonth()+1)}-${p(kst.getUTCDate())} ${p(kst.getUTCHours())}:${p(kst.getUTCMinutes())}`;
          if (!existsSync('data')) mkdirSync('data');
          let logs = []; try { logs = JSON.parse(readFileSync('data/log.json','utf8')); } catch {}
          const last = logs[logs.length-1];
          if (last && last.t.slice(0,13) === t.slice(0,13)) { console.log('이 시간대 이미 기록됨 — 건너뜀'); process.exit(0); }
          logs.push({ iso: nowUTC.toISOString(), t, ta: Ta, rh: RH, pt, src: '기상청(청주)' });
          if (logs.length > 20000) logs = logs.slice(-20000);
          writeFileSync('data/log.json', JSON.stringify(logs));
          console.log('기록 완료:', t, Ta+'℃', RH+'%', '체감', pt+'℃');
          EOF
          node collect.mjs

      - name: Commit
        run: |
          git config user.name "heat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/log.json
          git diff --staged --quiet || git commit -m "log: $(date -u +%FT%TZ)"
          git push
